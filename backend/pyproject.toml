[project]
name = "sec-rag-backend"
version = "0.1.0"
description = "Production RAG over SEC 10-K filings with evaluation harness"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "anthropic>=0.39.0",
    "openai>=1.54.0",
    "cohere>=5.11.0",
    "llama-index>=0.11.20",
    "llama-index-embeddings-openai>=0.2.5",
    "llama-index-llms-anthropic>=0.3.7",
    "llama-index-vector-stores-chroma>=0.2.0",
    "chromadb>=0.5.20",
    "ragas>=0.2.6",
    "datasets>=3.0.0",
    "sec-edgar-downloader>=5.0.3",
    "unstructured>=0.16.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.0.36",
    "tiktoken>=0.8.0",
    "tenacity>=9.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
