services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sec-rag-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
      - backend_venv:/app/.venv
    networks:
      - sec-rag-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The frontend dev server runs natively on the host (`make frontend`) on
  # macOS — Docker Desktop's VirtioFS bind-mounts hit EDEADLK errors when
  # Node reads mounted files. The frontend Dockerfile is kept for CI / prod.
  # On Linux you can run it via `docker compose --profile docker-fe up`.
  frontend:
    profiles: ["docker-fe"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sec-rag-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://backend:8000
    depends_on:
      - backend
    networks:
      - sec-rag-net

networks:
  sec-rag-net:
    driver: bridge

volumes:
  backend_venv:
